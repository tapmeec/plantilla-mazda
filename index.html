<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio - Mazda Cumbayá</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-image: url('./fondomazda.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        .link-card {
            background: rgba(20, 20, 20, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .link-card:hover {
            background: rgba(40, 40, 40, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-between py-6 px-4">

    <!-- Contenedor principal centrado -->
    <div class="w-full max-w-md flex flex-col items-center mx-auto">

        <!-- Logotipo de Mazda -->
        <div class="w-full flex justify-start mb-6 px-2">
            <img src="./logomazda.png" alt="Mazda Logo" class="h-8 object-contain">
        </div>

        <!-- Imagen de Perfil Circular -->
        <div class="mb-4 relative">
            <div class="w-44 h-44 rounded-full overflow-hidden border-2 border-white/20 shadow-2xl bg-gray-800 flex items-center justify-center">
                <img src="./gabyfoto.jpg" alt="Gabriela Ramos" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Información de la Persona -->
        <div class="text-center mb-8">
            <h1 class="text-lg font-bold tracking-wider text-white">GABRIELA RAMOS</h1>
            <h2 class="text-sm font-semibold tracking-wider text-white mb-2">JEFE COMERCIAL</h2>
            <div class="w-16 h-0.5 bg-red-600 mx-auto my-1"></div>
            <p class="text-xs tracking-widest text-gray-300 uppercase mt-2">MAZDA CUMBAYA</p>
        </div>

        <!-- Botones de Enlaces -->
        <div class="w-full flex flex-col gap-3.5 mb-10">
            
            <!-- WhatsApp -->
            <a href="https://wa.me/" target="_blank" class="link-card flex items-center justify-between px-4 py-3.5 text-white">
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center p-1.5 shadow">
                        <svg class="w-5 h-5 text-emerald-600 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448c-.63.351-5.188 1.839-5.188 1.839zm12.029-20.675c-5.498 0-9.972 4.474-9.974 9.974-.001 1.802.49 3.555 1.424 5.093l-.935 3.414 3.497-.917c1.479.807 3.155 1.233 4.876 1.235h.004c5.497 0 9.972-4.475 9.974-9.975.002-2.665-1.036-5.174-2.915-7.054-1.879-1.88-4.388-2.918-7.052-2.918zm5.503 14.195c-.223-.112-1.32-.652-1.524-.727-.204-.075-.353-.112-.502.112-.15.223-.577.727-.707.877-.13.15-.26.168-.483.056-.223-.112-.39-.35-2.073-1.282-1.281-.707-2.146-1.589-2.399-1.812-.253-.223-.027-.344.098-.456.101-.1.223-.26.335-.39.112-.13.15-.223.224-.373.075-.15.037-.28-.018-.39-.056-.112-.502-1.211-.689-1.659-.181-.439-.366-.381-.502-.388l-.429-.008c-.15 0-.39.056-.595.28-.204.223-.781.762-.781 1.861s.8 2.158.91 2.308c.112.15 1.572 2.398 3.807 3.364.533.23.948.367 1.272.47.534.17 1.021.146 1.405.089.431-.064 1.32-.54 1.506-1.062.185-.522.185-.969.13-1.062-.055-.093-.203-.149-.426-.261z"/></svg>
                    </div>
                    <span class="text-xs font-bold tracking-widest">WHATSAPP</span>
                </div>
                <div class="border-l border-white/30 pl-4">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>
            </a>

            <!-- Reseña de Google -->
            <a href="#" target="_blank" class="link-card flex items-center justify-between px-4 py-3.5 text-white">
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center p-1.5 shadow">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.6 3.6 1.7 7.4l3.7 2.9C6.3 7.3 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.4 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.7 6.4C.6 8.6 0 10.2 0 12s.6 3.4 1.7 5.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.7-2.3-6.6-5.3L1.7 15.6C3.6 19.4 7.4 23 12 23z"/></svg>
                    </div>
                    <span class="text-xs font-bold tracking-widest">RESEÑA DE GOOGLE</span>
                </div>
                <div class="border-l border-white/30 pl-4">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>
            </a>

            <!-- Correo -->
            <a href="mailto:" class="link-card flex items-center justify-between px-4 py-3.5 text-white">
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center p-1.5 shadow">
                        <svg class="w-5 h-5 text-gray-700 fill-current" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    </div>
                    <span class="text-xs font-bold tracking-widest">CORREO</span>
                </div>
                <div class="border-l border-white/30 pl-4">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>
            </a>

            <!-- Ubicación -->
            <a href="#" target="_blank" class="link-card flex items-center justify-between px-4 py-3.5 text-white">
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center p-1.5 shadow">
                        <svg class="w-5 h-5 text-red-600 fill-current" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </div>
                    <span class="text-xs font-bold tracking-widest">UBICACIÓN</span>
                </div>
                <div class="border-l border-white/30 pl-4">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>
            </a>

            <!-- Instagram -->
            <a href="#" target="_blank" class="link-card flex items-center justify-between px-4 py-3.5 text-white">
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center p-1.5 shadow">
                        <svg class="w-5 h-5 text-pink-600 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    </div>
                    <span class="text-xs font-bold tracking-widest">INSTAGRAM</span>
                </div>
                <div class="border-l border-white/30 pl-4">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </div>
            </a>

        </div>

        <!-- Logotipo TAPME en el pie -->
        <div class="w-full flex flex-col items-center justify-center mt-auto pb-4">
            <img src="./logotapme.png" alt="TapMe Logo" class="h-6 object-contain mb-1">
            <p class="text-[9px] tracking-[0.25em] text-gray-400 uppercase">CONECTA CON UN TOQUE</p>
        </div>

    </div>

</body>
</html>
